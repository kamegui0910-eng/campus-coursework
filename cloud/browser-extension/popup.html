<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Coursework 浏览器助手</title><link rel="stylesheet" href="popup.css"><body><h1>带走你的课程资料</h1><p>先在学校官网正常登录，并完成手机验证。保持学校标签页打开，本助手只读取你主动选择的课程，不保存密码或导出登录会话。</p><button id="discover">读取当前学校的课程</button><div id="courses"></div><label><input type="checkbox" id="attachments" checked>下载大纲及课堂附件（每课最多8份、总计8MB）</label><button id="collect" disabled>导出选中的课程</button><p id="status" role="status"></p><p>保持这个窗口打开，完成后保存 .coursework.json，再到 Coursework → 添加课程 → 浏览器导入。文件包含私人课程资料，请只上传到自己的空间。</p><script type="module" src="popup.mjs"></script></body></html>

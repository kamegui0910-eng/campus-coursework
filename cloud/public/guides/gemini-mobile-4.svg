<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Gemini · 手机浏览器 · 4/4</title><desc id="desc">回到这里连接。选 Gemini，粘贴密钥，再读取、选择模型。地址已自动填好。。这是位置与操作示意，不是官网截图。</desc><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="600" height="740" rx="8" fill="#f5f4f0" stroke="none" stroke-width="2"/><text x="26" y="36" fill="#37343F" font-size="22" font-weight="750">Gemini · 手机浏览器 · 4/4</text><text x="26" y="70" fill="#726a7a" font-size="18" font-weight="500">操作示意图 · 非官网截图</text><rect x="104" y="103" width="392" height="540" rx="28" fill="#fff" stroke="#37343F" stroke-width="2"/><rect x="249" y="111" width="102" height="16" rx="8" fill="#37343F" stroke="none" stroke-width="2"/><rect x="118" y="141" width="364" height="36" rx="8" fill="#eeeaf3" stroke="none" stroke-width="2"/><text x="130" y="166" fill="#37343F" font-size="18" font-weight="500">Coursework / 连接设置</text><text x="128" y="208" fill="#4051E8" font-size="25" font-weight="750">4  粘贴并读取模型</text><text x="128" y="251" fill="#37343F" font-size="20" font-weight="500">API 密钥</text><rect x="128" y="267" width="344" height="45" rx="8" fill="#f8f7fa" stroke="#d6cfde" stroke-width="2"/><text x="140" y="298" fill="#37343F" font-size="23" font-weight="500">•••• •••• ••••</text><rect x="128" y="331" width="344" height="49" rx="8" fill="#f5ff7a" stroke="#37343F" stroke-width="2"/><text x="140" y="363" fill="#37343F" font-size="22" font-weight="700">读取可用模型  →</text><text x="128" y="419" fill="#4051E8" font-size="22" font-weight="750">选择模型 → 保存连接</text><text x="26" y="713" fill="#726a7a" font-size="18" font-weight="500">找不到按钮？试试浏览器的“请求桌面网站”。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">Claude · 手机浏览器 · 2/4</title><desc id="desc">创建个人使用密钥。点击 Create key，填写名称并核对到期时间、账号与工作区。。这是位置与操作示意，不是官网截图。</desc><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="600" height="740" rx="8" fill="#f5f4f0" stroke="none" stroke-width="2"/><text x="26" y="36" fill="#37343F" font-size="22" font-weight="750">Claude · 手机浏览器 · 2/4</text><text x="26" y="70" fill="#726a7a" font-size="18" font-weight="500">操作示意图 · 非官网截图</text><rect x="104" y="103" width="392" height="540" rx="28" fill="#fff" stroke="#37343F" stroke-width="2"/><rect x="249" y="111" width="102" height="16" rx="8" fill="#37343F" stroke="none" stroke-width="2"/><rect x="118" y="141" width="364" height="36" rx="8" fill="#eeeaf3" stroke="none" stroke-width="2"/><text x="130" y="166" fill="#37343F" font-size="18" font-weight="500">Claude Console</text><text x="128" y="208" fill="#4051E8" font-size="25" font-weight="750">2  创建密钥</text><text x="128" y="258" fill="#37343F" font-size="21" font-weight="500">名称 / Name</text><rect x="128" y="277" width="344" height="48" rx="8" fill="#f8f7fa" stroke="#d6cfde" stroke-width="2"/><text x="140" y="309" fill="#37343F" font-size="19" font-weight="500">Coursework（示例名称）</text><rect x="128" y="355" width="344" height="58" rx="8" fill="#ff62c0" stroke="#37343F" stroke-width="2"/><text x="142" y="392" fill="#37343F" font-size="21" font-weight="750">Create key</text><text x="128" y="453" fill="#4051E8" font-size="21" font-weight="700">↑  在官方页面完成创建</text><text x="26" y="713" fill="#726a7a" font-size="18" font-weight="500">找不到按钮？试试浏览器的“请求桌面网站”。</text></g></svg>
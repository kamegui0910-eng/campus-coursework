<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">OpenAI / Codex · 手机浏览器 · 1/4</title><desc id="desc">打开 API 平台。登录 OpenAI Platform，打开 API keys 页面。。这是位置与操作示意，不是官网截图。</desc><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="600" height="740" rx="8" fill="#f5f4f0" stroke="none" stroke-width="2"/><text x="26" y="36" fill="#37343F" font-size="22" font-weight="750">OpenAI / Codex · 手机浏览器 · 1/4</text><text x="26" y="70" fill="#726a7a" font-size="18" font-weight="500">操作示意图 · 非官网截图</text><rect x="104" y="103" width="392" height="540" rx="28" fill="#fff" stroke="#37343F" stroke-width="2"/><rect x="249" y="111" width="102" height="16" rx="8" fill="#37343F" stroke="none" stroke-width="2"/><rect x="118" y="141" width="364" height="36" rx="8" fill="#eeeaf3" stroke="none" stroke-width="2"/><text x="130" y="166" fill="#37343F" font-size="18" font-weight="500">OpenAI Platform</text><text x="128" y="208" fill="#4051E8" font-size="25" font-weight="750">1  打开官方入口</text><rect x="128" y="232" width="344" height="88" rx="8" fill="#f5ff7a" stroke="none" stroke-width="2"/><text x="140" y="266" fill="#37343F" font-size="21" font-weight="700">platform.openai.com</text><text x="140" y="296" fill="#37343F" font-size="17" font-weight="500">在 Safari / Chrome 中登录</text><text x="128" y="368" fill="#37343F" font-size="23" font-weight="700">API keys / 密钥管理</text><rect x="128" y="393" width="344" height="52" rx="8" fill="#4051e8" stroke="none" stroke-width="2"/><text x="142" y="427" fill="white" font-size="22" font-weight="700">打开 API keys  →</text><text x="26" y="713" fill="#726a7a" font-size="18" font-weight="500">找不到按钮？试试浏览器的“请求桌面网站”。</text></g></svg>